services:
  - type: web
    name: lifeos-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: ConnectionStrings__LifeOS
        value: Data Source=/tmp/lifeos.db
      - key: Documents__StoragePath
        value: /tmp/documents
      - key: Logging__FilePath
        value: /tmp/logs
      - key: Cors__AllowedOrigins__0
        value: capacitor://localhost
      - key: Cors__AllowedOrigins__1
        value: https://localhost
      - key: Cors__AllowedOrigins__2
        value: https://lifeos.local
      - key: AI__Provider
        value: OpenAI
